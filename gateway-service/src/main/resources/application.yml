server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          # ✅ NEW KEYS in 2025.x
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          routes:
            # Auth service (open)
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            # Poll service (JWT validated by poll-service)
            - id: poll-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
