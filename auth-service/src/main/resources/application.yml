server:
  port: 8081

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/authdb   # your DB name
    username: app                                # your DB user
    password: app                                # your DB pass
  jpa:
    hibernate.ddl-auto: update                   # keeps schema in sync
    open-in-view: false
    properties:
      hibernate.format_sql: true

jwt:
  secret: "change-this-to-a-long-random-secret-at-least-64-bytes"
  expirySeconds: 3600
