server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        # Put AUTH FIRST (more specific)
        - id: auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        # Then POLL (more general)
        - id: poll
          uri: http://localhost:8082
          predicates:
            - Path=/api/**
  webflux:
    cors:
      mappings:
        - path: "/**"
          allowedOrigins: "http://localhost:5173"
          allowedMethods: "*"
          allowedHeaders: "*"
          allowCredentials: true
          maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: "health,info,gateway"
  endpoint:
    gateway:
      enabled: true
