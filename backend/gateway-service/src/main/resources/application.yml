server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        # AUTH goes to :8081
        - id: auth-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          # DO NOT strip /api unless your auth-service expects no /api prefix
          # filters:
          #   - StripPrefix=0

        # EVERYTHING ELSE under /api/** goes to poll-service :8082
        - id: poll-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/**
          # IMPORTANT: Do NOT StripPrefix here if your poll-service endpoints are /api/polls
          # filters:
          #   - StripPrefix=0

      # CORS (so frontend :5173 can call gateway :8080)
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: ["http://localhost:5173"]
            allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowedHeaders: ["*"]
            exposedHeaders: ["*"]
            allowCredentials: true

      # If downstream services also add CORS, dedupe
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
