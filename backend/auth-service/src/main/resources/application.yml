server:
  port: 8081

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/authdb
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
      hibernate.dialect: org.hibernate.dialect.MariaDBDialect

# ADD/VERIFY THESE
app:
  jwt:
    # >= 32 chars (256-bit). Use something long & random.
    secret: "i8bU2JfE0Qj1oZ4r7xNA3wPq6sT9vYc2Ld5mHgKzR8nW4eX6pQ1tV3yZ5uA7bC9d"
    expires-in: 3600000   # 1 hour in ms

# (Optional) keep DEBUG on while we finish
logging:
  level:
    org.springframework.security: DEBUG
